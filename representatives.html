<!doctype html><html lang="mr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="कुर्डूवाडी लोकप्रतिनिधी माहिती"><title>लोकप्रतिनिधी | कुर्डुवाडी</title><link rel="stylesheet" href="css/style.css"><style>.rep-page{max-width:1180px;margin:auto;padding:32px 18px 70px}.rep-head{text-align:center;margin-bottom:28px}.rep-head h1{font-size:clamp(30px,5vw,48px);margin:10px 0 8px}.rep-head p{color:#64748b;margin:0}.rep-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,380px));justify-content:center;gap:22px}.rep-card{overflow:hidden;border:1px solid rgba(15,23,42,.09);border-radius:24px;background:linear-gradient(145deg,#fff,#f8fafc);box-shadow:0 14px 40px rgba(15,23,42,.10)}.rep-top{height:7px;background:linear-gradient(90deg,#0f172a,#2563eb,#16a34a)}.rep-photo-wrap{padding:24px 24px 8px;text-align:center}.rep-photo{width:150px;height:150px;border-radius:50%;object-fit:cover;border:5px solid #fff;box-shadow:0 8px 26px rgba(15,23,42,.18);background:#e2e8f0}.rep-body{padding:8px 24px 24px;text-align:center}.rep-role{display:inline-flex;padding:7px 12px;border-radius:999px;background:#ecfdf5;color:#166534;font-weight:800;font-size:14px;margin:5px 0 12px}.rep-name{font-size:25px;line-height:1.2;margin:0 0 9px;color:#0f172a}.rep-place{font-weight:700;color:#334155;margin:0 0 12px}.rep-desc{color:#64748b;line-height:1.6;margin:14px 0}.rep-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:16px}.rep-btn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:0 14px;border-radius:12px;text-decoration:none;font-weight:800;border:1px solid #e2e8f0;background:#fff;color:#0f172a}.rep-btn.primary{background:#0f172a;color:#fff;border-color:#0f172a}.rep-btn.instagram{background:linear-gradient(135deg,#833ab4,#fd1d1d,#fcb045);color:#fff;border-color:transparent}.rep-more{cursor:pointer}.rep-details{display:none;margin-top:14px;padding:14px;border-radius:14px;background:#f8fafc;text-align:left;color:#475569;line-height:1.65}.rep-details.open{display:block}.rep-footer{text-align:center;color:#94a3b8;font-size:12px;margin-top:38px}.request-msg{font-size:13px;margin:10px 0;color:#166534}@media(max-width:600px){.rep-page{padding-top:22px}.rep-photo{width:132px;height:132px}.rep-body{padding:8px 18px 20px}.rep-name{font-size:22px}.rep-actions{display:grid;grid-template-columns:1fr 1fr}.rep-btn{width:100%}}</style></head><body><header class="header"><a class="brand" href="index.html"><div class="brand-mark">K</div><div><strong>कुर्डुवाडी</strong><small>PUBLIC REPRESENTATIVES</small></div></a><a class="outline-btn" href="index.html">← मुख्यपृष्ठ</a></header><main class="rep-page"><section class="rep-head"><span class="section-label">PUBLIC REPRESENTATIVES</span><h1>🏛️ लोकप्रतिनिधी</h1><p>कुर्डुवाडी व माढा परिसरातील लोकप्रतिनिधींची सार्वजनिक माहिती.</p></section><section id="reps" class="rep-grid"><div>माहिती loading...</div></section><p class="rep-footer">मोबाइल क्रमांक सार्वजनिक उपलब्ध नसल्यास Admin कडे विनंती पाठवता येईल.</p></main><script src="js/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const cfg=window.KURDUWADI_CONFIG||{},db=supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY),root=document.getElementById('reps');function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function url(v){const s=String(v||'').trim();return /^https?:\/\//i.test(s)?s:''}function phoneUrl(v){const n=String(v||'').replace(/\D/g,'');return n?(n.length===10?'91'+n:n):''}function representativeOverrides(r){const n=String(r.name||'').toLowerCase();if(n.includes('अभिजीत')||n.includes('abhijit'))return Object.assign({},r,{social_url:'https://www.instagram.com/_abhijeetpatil_/'});if(n.includes('जयश्री')||n.includes('jayshree'))return Object.assign({},r,{social_url:'https://www.instagram.com/jayshreebhise_/'});if(n.includes('धैर्यशील')||n.includes('dhairyasheel'))return Object.assign({},r,{social_url:'https://www.instagram.com/dhairyasheelmohitepatil/',photo_url:r.photo_url||'https://feeds.abplive.com/onecms/images/uploaded-images/2024/06/04/8ba21e47b22f2f0362f779bcffaa90611717472257208339_original.JPG?impolicy=abp_cdn&imwidth=640'});return r}function repRank(r){const n=String(r.name||'').toLowerCase();if(n.includes('अभिजीत')||n.includes('abhijit'))return 1;if(n.includes('जयश्री')||n.includes('jayshree'))return 2;if(n.includes('धैर्यशील')||n.includes('dhairyasheel'))return 3;if(String(r.role||'').includes('सभापती'))return 4;if(String(r.role||'').includes('उपसभापती'))return 5;if(String(r.role||'').includes('उपनगराध्यक्ष'))return 6;return 20}async function requestPhone(id,el){if(!confirm('या लोकप्रतिनिधीचा मोबाइल नंबर उपलब्ध करून देण्यासाठी Admin कडे विनंती पाठवायची का?'))return;el.disabled=true;const {error}=await db.from('representative_contact_requests').insert({representative_id:id,message:'मोबाइल नंबरासाठी विनंती'});el.disabled=false;if(error){console.error('representative contact request error',error);alert('❌ विनंती पाठवता आली नाही.');return}el.textContent='✅ विनंती पाठवली';el.disabled=true}(async()=>{const {data,error}=await db.rpc('get_public_representatives');if(error){console.error('get_public_representatives error',error);root.innerHTML='<div class="content-card">माहिती लोड करताना अडचण आली.</div>';return}if(!data?.length){root.innerHTML='<div class="content-card">अद्याप लोकप्रतिनिधी माहिती उपलब्ध नाही.</div>';return}root.innerHTML=data.map((raw,i)=>{const r=representativeOverrides(raw),photo=url(r.photo_url),site=url(r.social_url),ph=phoneUrl(r.phone);return `<article class="rep-card"><div class="rep-top"></div><div class="rep-photo-wrap">${photo?`<img class="rep-photo" src="${esc(photo)}" alt="${esc(r.name)}" loading="lazy">`:'<div class="rep-photo">🏛️</div>'}</div><div class="rep-body"><span class="rep-role">🏛️ ${esc(r.role||'लोकप्रतिनिधी')}</span><h2 class="rep-name">${esc(r.name)}</h2>${r.ward?`<p class="rep-place">📍 ${esc(r.ward)}</p>`:''}${r.description?`<p class="rep-desc">${esc(r.description)}</p>`:''}<div class="rep-actions">${ph?`<a class="rep-btn primary" href="tel:+${ph}">📞 संपर्क</a>`:`<button type="button" class="rep-btn primary request-phone" data-id="${esc(r.id)}">📱 मोबाइल नंबरसाठी Admin ला विनंती</button>`}${r.email?`<a class="rep-btn" href="mailto:${esc(r.email)}">✉️ ई-मेल</a>`:''}${site?`<a class="rep-btn instagram" href="${esc(site)}" target="_blank" rel="noopener noreferrer">📷 Instagram</a>`:''}<button type="button" class="rep-btn rep-more" data-more="rep-details-${i}">ℹ️ अधिक माहिती</button></div><div id="rep-details-${i}" class="rep-details">${r.party?`<div><b>पक्ष:</b> ${esc(r.party)}</div>`:''}${r.description?`<div><b>माहिती:</b> ${esc(r.description)}</div>`:''}${r.office_address?`<div><b>कार्यालय:</b> ${esc(r.office_address)}</div>`:''}${site?`<div><a href="${esc(site)}" target="_blank" rel="noopener noreferrer">🌐 Instagram / अधिकृत प्रोफाइल</a></div>`:''}</div><div class="request-msg" aria-live="polite"></div></div></article>`}).join('')})();document.addEventListener('click',e=>{const m=e.target.closest('[data-more]');if(m){const d=document.getElementById(m.dataset.more);if(d){d.classList.toggle('open');m.textContent=d.classList.contains('open')?'↩️ माहिती बंद':'ℹ️ अधिक माहिती'}}const b=e.target.closest('.request-phone');if(b)requestPhone(b.dataset.id,b)});</script><script src="js/site.js"></script><script src="js/analytics.js"></script></body></html>
