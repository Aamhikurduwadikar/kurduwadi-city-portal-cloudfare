<!doctype html><html lang="mr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="कुर्डूवाडीची अभिमानास्पद व्यक्तिमत्त्वे सुचवा."><title>व्यक्तिमत्त्व सुचवा | आम्ही Kurduwadikar</title><link rel="stylesheet" href="css/style.css"></head><body class="form-page"><header class="header"><a class="brand" href="index.html"><div class="brand-mark">K</div><div><strong>आम्ही Kurduwadikar</strong><small>KURDUWADI COMMUNITY PORTAL</small></div></a><a class="outline-btn" href="personalities.html">← व्यक्तिमत्त्वे</a></header><main class="form-wrap"><div class="form-intro"><span class="section-label">KURDUWADI PRIDE</span><h1>🏅 व्यक्तिमत्त्व सुचवा</h1><p>कुर्डूवाडीशी संबंधित प्रेरणादायी व्यक्तीची माहिती पाठवा. Admin पडताळणी केल्यानंतर ती विशेष संग्रहात प्रकाशित केली जाईल.</p></div><form id="personalityForm"><label>व्यक्तीचे नाव *<input name="name" required maxlength="160"></label><div class="two"><label>कुर्डूवाडीशी संबंध<input name="relation" maxlength="240" placeholder="उदा. जन्म / शिक्षण / व्यवसाय"></label><label>क्षेत्र / व्यवसाय<select name="field"><option value="">क्षेत्र निवडा</option><option>प्रशासकीय सेवा</option><option>अभियांत्रिकी व तंत्रज्ञान</option><option>कला व संस्कृती</option><option>न्याय व विधी</option><option>वैद्यकीय व आरोग्यसेवा</option><option>कृषी व कृषीउद्योजकता</option><option>पोलीस व संरक्षण सेवा</option><option>शिक्षण व संशोधन</option><option>व्यवसाय व उद्योग</option><option>क्रीडा</option><option>सामाजिक कार्य व पत्रकारिता</option><option>राजकीय व लोकसेवा</option><option>इतर</option></select></label></div><label>का अभिमानास्पद व्यक्तिमत्त्व आहे? *<textarea name="reason" rows="7" required maxlength="8000" placeholder="कामगिरी, योगदान, पुरस्कार किंवा उल्लेखनीय कार्य लिहा..."></textarea></label><div class="two"><label>विश्वसनीय संदर्भ / Profile Link<input name="reference_url" type="url" placeholder="https://..."></label><label>फोटो (ऐच्छिक)<input id="personalityImage" name="image" type="file" accept="image/jpeg,image/png,image/webp"></label></div><label>तुमचा मोबाईल (ऐच्छिक)<input name="contact" inputmode="tel" maxlength="20"></label><p class="upload-note">फोटो कमाल 5 MB. JPG, PNG किंवा WebP.</p><button class="primary-btn" type="submit">🏅 माहिती पाठवा →</button><p id="personalityMsg" class="form-message"></p></form></main><script src="js/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/personality-submit.js"></script><script src="js/site.js"></script><script src="js/analytics.js"></script>
