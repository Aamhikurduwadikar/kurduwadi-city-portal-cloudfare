er':{'@type':'Organization','name':'कुर्डुवाडी सिटी पोर्टल','url':'https://aamhikurduwadikar.com/'}};if(n.image_url)ld.image=[n.image_url];const s=document.createElement('script');s.type='application/ld+json';s.textContent=JSON.stringify(ld);document.head.appendChild(s)}catch(e){box.innerHTML='<h1>बातमी लोड झाली नाही</h1><p>कृपया पुन्हा प्रयत्न करा.</p>'}}load();</script><script src="js/site.js"></script><script src="js/analytics.js"></script></body></html>
