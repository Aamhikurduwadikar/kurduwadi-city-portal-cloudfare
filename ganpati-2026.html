<!doctype html>
<html lang="mr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>गणेशोत्सव २०२६ | कुर्डुवाडी सिटी पोर्टल</title>
<meta name="description" content="कुर्डुवाडी गणेशोत्सव २०२६ — Admin-मंजूर फोटो आणि व्हिडिओ.">
<link rel="canonical" href="https://aamhikurduwadikar.com/ganpati-2026">
<link rel="stylesheet" href="css/style.css">
<style>
body{margin:0;background:#fff8ef;color:#102a43;font-family:system-ui,-apple-system,"Noto Sans Devanagari",sans-serif}
.g-wrap{max-width:1150px;margin:auto;padding:20px}
.g-hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#5a160b 0%,#8e260f 55%,#c45b12 100%);color:#fff;border:1px solid #e6a63c;border-radius:30px;padding:34px;margin:20px 0;box-shadow:0 18px 45px rgba(91,31,10,.22)}
.g-hero:after{content:'🙏';position:absolute;right:-15px;bottom:-45px;font-size:180px;opacity:.10;transform:rotate(-8deg)}
.badge{display:inline-block;background:rgba(255,209,92,.15);border:1px solid #e7b34a;color:#ffd86b;padding:9px 15px;border-radius:999px;font-weight:900;position:relative;z-index:1}
.g-hero h1{font-size:clamp(38px,7vw,64px);line-height:1.15;margin:16px 0 8px;color:#fff!important;text-shadow:0 2px 10px rgba(0,0,0,.25);position:relative;z-index:1}
.g-hero p{font-size:19px;line-height:1.75;color:#fff8e8!important;margin:0;max-width:850px;position:relative;z-index:1}
.media-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin:24px 0 40px}
.media-card{background:#fff;border:1px solid #e6edf3;border-radius:20px;overflow:hidden;box-shadow:0 8px 25px rgba(16,42,67,.08)}
.media-card img,.media-card video{width:100%;height:280px;object-fit:cover;display:block;background:#edf2f7}
.media-card video{object-fit:contain}
.media-card .mi{padding:14px 16px}.media-card h3{margin:0;color:#102a43;font-size:18px}.media-card p{margin:5px 0 0;color:#627d98;font-size:13px;line-height:1.5}
.empty{padding:35px 20px;background:#fff;border:1px dashed #cbd5e1;border-radius:20px;color:#627d98;text-align:center;margin:25px 0 40px}.error{display:none;background:#fff0f0;color:#9f2d2d;padding:18px;border-radius:14px;margin:20px 0}
@media(max-width:800px){.media-grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.g-wrap{padding:12px}.g-hero{padding:23px 20px}.g-hero:after{font-size:120px}.media-grid{grid-template-columns:1fr}.media-card img,.media-card video{height:260px}}
</style>
</head>
<body>
<header class="header"><a class="brand" href="index.html" aria-label="कुर्डुवाडी मुख्यपृष्ठ"><div class="brand-mark">K</div><div><strong>कुर्डुवाडी</strong><small>KURDUWADI CITY PORTAL</small></div></a><nav aria-label="मुख्य मेनू"><a href="index.html">मुख्यपृष्ठ</a><a href="news.html">बातम्या</a><a href="events.html">कार्यक्रम</a><a href="directory.html">डिरेक्टरी</a><a href="gallery.html">गॅलरी</a></nav></header>
<main class="g-wrap"><section class="g-hero"><span class="badge">🙏 विशेष विभाग • गणेशोत्सव २०२६</span><h1>गणपती बाप्पा मोरया!</h1><p>कुर्डुवाडीतील Admin-मंजूर गणेशोत्सवाचे फोटो आणि व्हिडिओ.</p></section><div id="err" class="error"></div><section><h2>🎉 गणेशोत्सव फोटो आणि व्हिडिओ</h2><div id="media" class="media-grid"><div class="empty">फोटो आणि व्हिडिओ लोड होत आहेत…</div></div></section></main>
<script src="js/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(async()=>{const cfg=window.KURDUWADI_CONFIG||{},media=document.getElementById('media'),err=document.getElementById('err');try{if(!cfg.SUPABASE_URL||!cfg.SUPABASE_ANON_KEY)throw new Error('Supabase configuration missing');const db=supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);const {data,error}=await db.from('gallery_items').select('id,title,description,media_type,media_url,category,created_at').eq('status','approved').ilike('category','ganpati-2026').order('created_at',{ascending:false});if(error)throw error;const items=(data||[]).filter(x=>x.media_url&&(x.media_type==='image'||x.media_type==='video'));if(!items.length){media.innerHTML='<div class="empty">अद्याप Admin-मंजूर गणेशोत्सव फोटो/व्हिडिओ उपलब्ध नाहीत.</div>';return}media.innerHTML=items.map(x=>{const u=String(x.media_url).trim(),title=String(x.title||'गणेशोत्सव २०२६').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])),desc=String(x.description||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])),safeUrl=u.replace(/"/g,'%22');return '<article class="media-card">'+(x.media_type==='video'?'<video src="'+safeUrl+'" controls preload="metadata" playsinline></video>':'<img src="'+safeUrl+'" loading="lazy" alt="'+title+'">')+'<div class="mi"><h3>'+title+'</h3>'+(desc?'<p>'+desc+'</p>':'')+'</div></article>'}).join('')}catch(e){console.error(e);media.innerHTML='';err.textContent='फोटो/व्हिडिओ लोड करताना अडचण आली: '+(e?.message||e);err.style.display='block'}})();
</script><script src="js/site.js"></script><script src="js/analytics.js"></script></body></html>
