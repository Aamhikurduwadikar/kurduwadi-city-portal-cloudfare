<!doctype html><html lang="mr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>मंजूर नागरिक प्रोफाइल | आम्ही कुर्डुवाडीकर</title><link rel="stylesheet" href="css/style.css"><style>body{background:#f6f7f8}.cp-shell{max-width:1100px;margin:auto;padding:35px 18px 100px}.cp-hero{margin-bottom:24px}.cp-hero h1{font-size:38px;color:#18324d;margin:8px 0}.cp-hero p{color:#64748b}.cp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.cp-card{display:block;text-decoration:none;color:inherit;background:#fff;border:1px solid #e2e8f0;border-radius:20px;padding:18px;box-shadow:0 8px 24px rgba(15,23,42,.06);position:relative}.cp-head{display:flex;gap:12px;align-items:center}.cp-photo,.cp-avatar{width:68px;height:68px;border-radius:50%;object-fit:cover}.cp-avatar{display:grid;place-items:center;background:#f3e8d0;color:#7a4b16;font-weight:900;font-size:25px}.cp-card h2{font-size:20px;margin:0;color:#18324d}.cp-city{color:#64748b;margin-top:3px}.cp-job{font-weight:800;margin-top:13px;color:#334155}.cp-field{font-size:13px;color:#64748b;margin-top:6px;line-height:1.5}.cp-badge{position:absolute;right:15px;top:14px;color:#087f5b;font-size:12px;font-weight:900}.cp-open{margin-top:14px;font-weight:900;color:#9a4b13}.cp-empty{background:#fff;padding:25px;border-radius:16px}.cp-back{display:inline-block;margin-bottom:18px}@media(max-width:800px){.cp-grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.cp-grid{grid-template-columns:1fr}.cp-hero h1{font-size:30px}}</style></head><body><header class="header"><a class="brand" href="index.html"><div class="brand-mark">K</div><div><strong>कुर्डुवाडी</strong><small>KURDUWADI CITY PORTAL</small></div></a><a class="outline-btn" href="index.html">← मुख्यपृष्ठ</a></header><main class="cp-shell"><a class="cp-back" href="index.html">← मुख्यपृष्ठ</a><div class="cp-hero"><span class="section-label">KURDUWADI CITIZENS</span><h1>मंजूर नागरिक प्रोफाइल</h1><p>Admin पडताळणीनंतर public करण्यास परवानगी दिलेल्या नागरिकांची माहिती.</p></div><section id="cpGrid" class="cp-grid"><div class="cp-empty">प्रोफाइल लोड होत आहेत…</div></section></main><script src="js/config.js?v=20260918"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(async()=>{const C=window.KURDUWADI_CONFIG,grid=document.getElementById('cpGrid');try{const db=supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY),{data,error}=await db.from('profiles').select('id,name,education,job,city,work_fields,photo_url,blood_group,blood_public').eq('status','approved').eq('is_public',true).order('created_at',{ascending:false}).limit(100);if(error)throw error;if(!data?.length){grid.innerHTML='<div class="cp-empty">अद्याप मंजूर public प्रोफाइल उपलब्ध नाहीत.</div>';return}const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const media=v=>{let u=String(v||'').trim();if(u&&!/^https?:\/\//i.test(u))u=C.SUPABASE_URL.replace(/\/$/,'')+'/storage/v1/object/public/'+C.STORAGE_BUCKET+'/'+u.replace(/^\/+/, '');return u};grid.innerHTML=data.map(p=>{const n=esc(p.name||'नागरिक'),fields=Array.isArray(p.work_fields)?p.work_fields.filter(Boolean).slice(0,3).map(esc).join(' • '):esc(p.work_fields||'');return `<a class="cp-card" href="citizen-profile.html?id=${encodeURIComponent(p.id)}"><span class="cp-badge">✓ Verified</span><div class="cp-head">${p.photo_url?`<img class="cp-photo" src="${esc(media(p.photo_url))}" alt="${n}" loading="lazy">`:`<div class="cp-avatar">${esc((p.name||'कु').trim().charAt(0))}</div>`}<div><h2>${n}</h2><div class="cp-city">📍 ${esc(p.city||'कुर्डुवाडी')}</div></div></div>${p.job?`<div class="cp-job">💼 ${esc(p.job)}</div>`:''}${p.education?`<div class="cp-field">🎓 ${esc(p.education)}</div>`:''}${fields?`<div class="cp-field">🎯 ${fields}</div>`:''}${p.blood_public&&p.blood_group?`<div class="cp-field">🩸 ${esc(p.blood_group)}</div>`:''}<div class="cp-open">पूर्ण प्रोफाइल पहा →</div></a>`}).join('')}catch(e){console.error(e);grid.innerHTML='<div class="cp-empty">❌ प्रोफाइल लोड करता आली नाही. कृपया पुन्हा प्रयत्न करा.</div>'}})();</script></body></html>
