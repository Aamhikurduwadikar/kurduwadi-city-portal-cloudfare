<!doctype html><html lang="mr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><meta name="description" content="कुर्डुवाडीतील कार्यक्रमाची सविस्तर माहिती."><title>कार्यक्रम | कुर्डुवाडी सिटी पोर्टल</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/news-events-premium.css"><style>main{max-width:900px;margin:auto;padding:28px 16px}.detail-card{background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:24px;box-shadow:0 10px 30px rgba(15,23,42,.06)}.detail-meta{display:flex;flex-wrap:wrap;gap:8px;color:#64748b;font-size:13px;margin-bottom:12px}.detail-meta span{background:#f1f5f9;padding:6px 10px;border-radius:999px}.detail-card h1{font-size:clamp(28px,5vw,46px);line-height:1.2;margin:8px 0 18px}.detail-card img{width:100%;max-height:600px;object-fit:contain;border-radius:16px;background:#f8fafc;margin:8px 0 22px}.event-info{display:grid;gap:10px;margin:18px 0}.event-info div{padding:11px 13px;border-radius:12px;background:#f8fafc}.detail-content{white-space:pre-line;line-height:1.9;color:#334155;font-size:17px}.back{display:inline-flex;margin:18px 0;padding:10px 14px;border-radius:10px;background:#effdf5;color:#166534;text-decoration:none;font-weight:800}</style></head><body class="city-feed"><header class="header"><a class="brand" href="index.html"><div class="brand-mark">K</div><div><strong>कुर्डुवाडी</strong><small>KURDUWADI CITY PORTAL</small></div></a><a class="outline-btn" href="events.html">← सर्व कार्यक्रम</a></header><main><a class="back" href="events.html">← कार्यक्रमांकडे परत</a><article id="article" class="detail-card"><h1>कार्यक्रम लोड होत आहे...</h1></article></main><footer><div class="copyright">© 2026 कुर्डुवाडी सिटी पोर्टल • <a href="privacy.html">Privacy</a> • <a href="contact.html">Contact</a></div></footer><script src="js/config.js"></script><script>const cfg=window.KURDUWADI_CONFIG||{};const esc=v=>String(v??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])).replace(/"/g,'&quot;').replace(/'/g,'&#39;');const fmt=v=>{try{return v?new Date(v+'T00:00:00').toLocaleDateString('mr-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'}):'तारीख नाही'}catch(e){return v||''}};async function load(){const id=new URLSearchParams(location.search).get('id'),box=document.getElementById('article');if(!id||!cfg.SUPABASE_URL||!cfg.SUPABASE_ANON_KEY){box.innerHTML='<h1>कार्यक्रम उपलब्ध नाही</h1><p>कृपया कार्यक्रमांच्या पानावरून पुन्हा उघडा.</p>';return}try{const u=cfg.SUPABASE_URL.replace(/\/$/,'')+'/rest/v1/events?select=*&id=eq.'+encodeURIComponent(id)+'&status=eq.approved&published=eq.true';const r=await fetch(u,{headers:{apikey:cfg.SUPABASE_ANON_KEY,Authorization:'Bearer '+cfg.SUPABASE_ANON_KEY}});const rows=await r.json();const n=rows?.[0];if(!n){box.innerHTML='<h1>कार्यक्रम सापडला नाही</h1><p>हा कार्यक्रम उपलब्ध नाही किंवा अद्याप प्रकाशित झालेला नाही.</p>';return}document.title=(n.title||'कार्यक्रम')+' | कुर्डुवाडी सिटी पोर्टल';document.querySelector('meta[name="description"]').content=String(n.description||n.title||'कुर्डुवाडीतील कार्यक्रम').slice(0,155);box.innerHTML='<div class="detail-meta"><span>🎉 कार्यक्रम</span>'+(n.category?'<span>🏷️ '+esc(n.category)+'</span>':'')+'</div><h1>'+esc(n.title)+'</h1>'+(n.image_url?'<img src="'+esc(n.image_url)+'" alt="'+esc(n.title)+'">':'')+'<div class="event-info"><div>📅 <b>तारीख:</b> '+esc(fmt(n.event_date))+'</div>'+(n.event_time?'<div>⏰ <b>वेळ:</b> '+esc(n.event_time)+'</div>':'')+'<div>📍 <b>ठिकाण:</b> '+esc(n.location||'-')+'</div>'+(n.organizer?'<div>👤 <b>आयोजक:</b> '+esc(n.organizer)+'</div>':'')+(n.contact?'<div>📞 <b>संपर्क:</b> '+esc(n.contact)+'</div>':'')+'</div><div class="detail-content">'+esc(n.description||'कार्यक्रमाची सविस्तर माहिती उपलब्ध नाही.')+'</div>';const start=(n.event_date||'')+(n.event_time?'T'+n.event_time:'');const ld={'@context':'https://schema.org','@type':'Event','name':n.title,'startDate':start||n.event_date,'eventStatus':'https://schema.org/EventScheduled','location':{'@type':'Place','name':n.location||'कुर्डुवाडी','address':{'@type':'PostalAddress','streetAddress':n.location||'कुर्डुवाडी','addressLocality':'Kurduwadi','addressRegion':'Maharashtra','addressCountry':'IN'}},'description':String(n.description||'').slice(0,500),'url':location.href,'organizer':{'@type':'Organization','name':n.organizer||'कुर्डुवाडी सिटी पोर्टल','url':'https://aamhikurduwadikar.com/'}};if(n.image_url)ld.image=[n.image_url];const s=document.createElement('script');s.type='application/ld+json';s.textContent=JSON.stringify(ld);document.head.appendChild(s)}catch(e){box.innerHTML='<h1>कार्यक्रम लोड झाला नाही</h1><p>कृपया पुन्हा प्रयत्न करा.</p>'}}load();</script><script src="js/site.js"></script><script src="js/analytics.js"></script></body></html>
