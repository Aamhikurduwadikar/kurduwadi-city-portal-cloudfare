<!doctype html><html lang="mr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Directory माहिती जोडा | Kurduwadi</title><link rel="stylesheet" href="css/style.css"></head><body class="form-page"><header class="header"><a class="brand" href="index.html"><div class="brand-mark">K</div><div><strong>कुर्डुवाडी</strong><small>CITIZEN DIRECTORY</small></div></a><a class="outline-btn" href="directory.html">← Directory</a></header><main class="form-wrap"><section class="form-intro"><span class="section-label">DIRECTORY SUBMISSION</span><h1>Directory मध्ये माहिती जोडा</h1><p>तुमची माहिती Admin पडताळणीनंतर Directory मध्ये प्रकाशित केली जाईल.</p></section><section class="card"><form id="directoryForm"><label>नाव / व्यवसायाचे नाव *<input id="business_name" required maxlength="120" placeholder="उदा. अमोल किराणा / अमोल पाटील"></label><label>वर्ग / व्यवसाय *<select id="category" required><option value="">वर्ग निवडा</option><option value="नोकरी / नोकदार">👔 नोकरी / नोकदार</option><option value="व्यवसाय / दुकान">🏪 व्यवसाय / दुकान</option><option value="शेती / शेतकरी">🌾 शेती / शेतकरी</option><option value="कुशल कामगार / कारागीर">🔧 कुशल कामगार / कारागीर</option><option value="शिक्षण / शिक्षक">🎓 शिक्षण / शिक्षक</option><option value="विद्यार्थी">📚 विद्यार्थी</option><option value="सेवा / मार्गदर्शन">🤝 सेवा / मार्गदर्शन</option><option value="इतर">👤 इतर</option></select></label><label>मोबाईल क्रमांक<input id="contact_number" maxlength="20" placeholder="WhatsApp / मोबाईल नंबर"></label><label>ई-मेल<input id="email" type="email" maxlength="160" placeholder="उदा. example@gmail.com"></label><label>पत्ता<input id="address" maxlength="300" placeholder="कुर्डुवाडी, ..."></label><label>वेळ<input id="timings" maxlength="120" placeholder="उदा. सकाळी 9 ते रात्री 9"></label><label>Google Maps Link (ऐच्छिक)<input id="google_maps_link" type="url" placeholder="https://maps.google.com/..."></label><label><input id="is_public" type="checkbox" checked> माझी माहिती Directory वर सार्वजनिक करण्यास माझी संमती आहे.</label><button class="primary-btn" type="submit">📤 माहिती Submit करा</button><p id="msg" class="muted"></p></form></section></main><script src="js/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/directory-submit.js"></script><style>.card select#category{width:100%;min-height:52px;padding:0 16px;border:1px solid #d9dfe4;border-radius:14px;background:#fff;color:#263b4d;font:inherit;font-size:16px;outline:none}.card select#category:focus{border-color:#c78645;box-shadow:0 0 0 4px rgba(199,134,69,.12)}</style></body></html>
