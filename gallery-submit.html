<!doctype html><html lang="mr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>फोटो/व्हिडिओ पाठवा | कुर्डूवाडी</title><link rel="stylesheet" href="css/style.css"></head><body class="form-page"><header class="header"><a class="brand" href="index.html"><div class="brand-mark">K</div><div><strong>कुर्डूवाडी</strong><small>GALLERY SUBMISSION</small></div></a><a class="outline-btn" href="gallery.html">← गॅलरी</a></header><main class="form-wrap"><div class="form-intro"><span class="section-label" id="mediaLabel">COMMUNITY MEDIA</span><h1 id="pageTitle">📸 फोटो / 🎥 व्हिडिओ पाठवा</h1><p id="pageIntro">फोटो किंवा व्हिडिओ थेट upload करा. URL टाकण्याची गरज नाही. Admin तपासणीनंतर gallery मध्ये प्रकाशित केला जाईल.</p></div><form id="galleryForm"><label>शीर्षक *<input name="title" required maxlength="160" placeholder="उदा. कुर्डूवाडी कार्यक्रम"></label><label>वर्णन<textarea name="description" rows="4" placeholder="थोडक्यात माहिती"></textarea></label><div class="two"><label>प्रकार<select name="media_type" id="mediaType"><option value="image">📸 फोटो</option><option value="video">🎥 व्हिडिओ</option></select></label><label>Category<input name="category" id="category" placeholder="शहर / रेल्वे / कार्यक्रम"></label></div><label>फोटो / व्हिडिओ *<input id="mediaFile" name="media_file" type="file" accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm,video/quicktime" required><small id="fileHelp" class="muted">फोटो: JPG, PNG, WEBP, GIF • कमाल 10 MB</small></label><div id="preview" style="margin:12px 0"></div><button class="primary-btn" id="submitBtn" type="submit">Upload करून पाठवा →</button><p id="galleryMsg" class="form-message"></p></form></main><script src="js/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient(KURDUWADI_CONFIG.SUPABASE_URL,KURDUWADI_CONFIG.SUPABASE_ANON_KEY);const form=document.getElementById('galleryForm'),typeEl=document.getElementById('mediaType'),fileEl=document.getElementById('mediaFile'),preview=document.getElementById('preview'),msg=document.getElementById('galleryMsg'),btn=document.getElementById('submitBtn'),help=document.getElementById('fileHelp'),categoryEl=document.getElementById('category');const params=new URLSearchParams(location.search),isGanpati=params.get('category')==='ganpati-2026';if(isGanpati){categoryEl.value='ganpati-2026';categoryEl.readOnly=true;categoryEl.setAttribute('aria-label','गणेशोत्सव २०२६ Category');document.getElementById('mediaLabel').textContent='GANESHOTSAV 2026 MEDIA';document.getElementById('pageTitle').textContent='🙏 गणेशोत्सव २०२६ — फोटो / व्हिडिओ पाठवा';document.getElementById('pageIntro').textContent='गणेशोत्सव २०२६ चे फोटो किंवा व्हिडिओ थेट upload करा. हे मीडिया गणेशोत्सव गॅलरीसाठी पाठवले जाईल. Admin तपासणीनंतर प्रकाशित केला जाईल.';document.title='गणेशोत्सव २०२६ — फोटो / व्हिडिओ पाठवा | कुर्डूवाडी';}function updateAccept(){fileEl.value='';preview.innerHTML='';if(typeEl.value==='image'){fileEl.accept='image/jpeg,image/png,image/webp,image/gif';help.textContent='फोटो: JPG, PNG, WEBP, GIF • कमाल 10 MB';}else{fileEl.accept='video/mp4,video/webm,video/quicktime';help.textContent='व्हिडिओ: MP4, WebM, MOV • कमाल 100 MB';}}typeEl.addEventListener('change',updateAccept);fileEl.addEventListener('change',()=>{preview.innerHTML='';const f=fileEl.files?.[0];if(!f)return;const max=typeEl.value==='image'?10:100;if(f.size>max*1024*1024){msg.textContent=`❌ File size ${max} MB पेक्षा जास्त आहे.`;fileEl.value='';return}const url=URL.createObjectURL(f);preview.innerHTML=typeEl.value==='image'?`<img src="${url}" alt="Preview" style="max-width:100%;max-height:280px;border-radius:12px">`:`<video src="${url}" controls style="max-width:100%;max-height:320px;border-radius:12px"></video>`;});form.addEventListener('submit',async e=>{e.preventDefault();msg.textContent='';const f=new FormData(form),file=fileEl.files?.[0];if(!file){msg.textContent='❌ फोटो/व्हिडिओ निवडा.';return}const wanted=typeEl.value==='image'?'image':'video';const ok=wanted==='image'?file.type.startsWith('image/'):file.type.startsWith('video/');const max=wanted==='image'?10:100;if(!ok){msg.textContent='❌ निवडलेली file प्रकाराशी जुळत नाही.';return}if(file.size>max*1024*1024){msg.textContent=`❌ File size ${max} MB पेक्षा जास्त आहे.`;return}btn.disabled=true;btn.textContent='Upload होत आहे...';try{const {data:{user}}=await db.auth.getUser();const ext=(file.name.split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,'');const path=`gallery/${wanted}/${crypto.randomUUID()}.${ext}`;const {error:upErr}=await db.storage.from(KURDUWADI_CONFIG.STORAGE_BUCKET).upload(path,file,{contentType:file.type,upsert:false});if(upErr)throw upErr;const {data:urlData}=db.storage.from(KURDUWADI_CONFIG.STORAGE_BUCKET).getPublicUrl(path);const selectedCategory=isGanpati?'ganpati-2026':f.get('category');const {error:dbErr}=await db.from('gallery_items').insert({title:f.get('title'),description:f.get('description'),media_type:wanted,media_url:urlData.publicUrl,category:selectedCategory,submitted_by:user?.id||null,status:'pending'});if(dbErr){await db.storage.from(KURDUWADI_CONFIG.STORAGE_BUCKET).remove([path]);throw dbErr}msg.textContent=isGanpati?'✅ गणेशोत्सवाचा फोटो/व्हिडिओ upload झाला. Admin मंजुरीनंतर गणेशोत्सव गॅलरीत प्रकाशित होईल.':'✅ फोटो/व्हिडिओ upload झाला. Admin मंजुरीनंतर प्रकाशित होईल.';form.reset();if(isGanpati){categoryEl.value='ganpati-2026';categoryEl.readOnly=true;}preview.innerHTML='';updateAccept();}catch(err){console.error(err);msg.textContent='❌ Submit करताना अडचण: '+(err?.message||err)}finally{btn.disabled=false;btn.textContent='Upload करून पाठवा →'}});updateAccept();</script><script src="js/site.js"></script><script src="js/analytics.js"></script></body></html>
