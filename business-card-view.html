<!doctype html>
<html lang="mr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="कुर्डूवाडी डिजिटल बिझनेस कार्ड">
<meta name="robots" content="index,follow"><title>डिजिटल बिझनेस कार्ड | कुर्डूवाडी</title>
<link rel="stylesheet" href="css/style.css">
<style>
:root{--navy:#0b2e59;--blue:#123f7a;--orange:#f36f21;--muted:#60748a}
.bc-page{max-width:900px;margin:30px auto;padding:0 14px}.bc-note{text-align:center;color:var(--muted);font-size:13px;margin:0 0 14px}.bc-shell{background:#fff;border-radius:28px;overflow:hidden;box-shadow:0 18px 55px rgba(18,63,122,.16);border:1px solid #e7edf5}.bc-top{background:linear-gradient(135deg,var(--navy),#1468b8);padding:26px 30px;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:18px}.bc-logo{width:235px;height:auto;border-radius:12px;background:#fff;padding:5px}.bc-kicker{font-size:12px;letter-spacing:2px;font-weight:900}.bc-body{padding:30px}.bc-profile{display:grid;grid-template-columns:minmax(0,1fr) 205px;gap:28px;align-items:center}.bc-name{font-size:42px;line-height:1.1;margin:0;color:var(--blue);font-weight:900}.bc-business{font-size:22px;color:var(--orange);font-weight:900;margin:10px 0}.bc-designation{font-weight:800;color:#52657b}.bc-bio{color:#52657b;line-height:1.7}.bc-info{margin-top:22px}.bc-row{padding:12px 0;border-bottom:1px solid #edf1f6;color:#304a66}.bc-row b{display:inline-block;min-width:105px;color:#60748a}.bc-row a{color:var(--blue);text-decoration:none;font-weight:800}.bc-qrbox{background:#f5f9ff;border:1px solid #d9e7f7;border-radius:20px;padding:16px;text-align:center}.bc-qrbox h3{margin:0 0 8px;color:var(--blue)}.bc-qr{display:flex;justify-content:center;background:#fff;padding:10px;border-radius:14px}.bc-qrbox small{display:block;color:var(--muted);line-height:1.45;margin-top:8px}.bc-actions{display:flex;flex-wrap:wrap;gap:10px;margin:24px 0 0}.bc-actions button,.bc-actions a{border:0;border-radius:12px;padding:13px 18px;font-weight:900;cursor:pointer;text-decoration:none}.bc-download{background:var(--orange);color:#fff}.bc-share{background:var(--blue);color:#fff}.bc-back{background:#eef4fb;color:var(--blue)}.bc-footer{background:var(--navy);color:#fff;padding:17px 24px;display:flex;align-items:center;justify-content:space-between;gap:15px}.bc-footer img{width:185px;background:#fff;border-radius:8px}.bc-footer-text{font-size:12px;line-height:1.5;text-align:right}.bc-card-download{position:fixed;left:-100000px;top:0;width:1011px;height:654px;overflow:hidden}.print-card{width:1011px;height:654px;background:#fff;overflow:hidden;border:1px solid #dce8f5;border-radius:0;font-family:Arial,"Noto Sans Devanagari",sans-serif;box-sizing:border-box}.print-head{height:104px;background:linear-gradient(135deg,var(--navy),#1468b8);padding:14px 28px;color:#fff;display:flex;justify-content:space-between;align-items:center;box-sizing:border-box}.print-head img{width:250px;max-height:76px;background:#fff;border-radius:8px;padding:4px}.print-badge{font-size:18px;font-weight:900;letter-spacing:1px}.print-main{height:463px;padding:25px 28px;display:grid;grid-template-columns:minmax(0,1fr) 195px;gap:22px;box-sizing:border-box}.print-main h1{font-size:48px;line-height:1.05;color:var(--blue);margin:0 0 7px}.print-main h2{font-size:23px;color:var(--orange);margin:4px 0 6px}.print-main p{color:#52657b;line-height:1.3;font-size:16px;margin:6px 0}.print-contact{font-size:17px;line-height:1.55;color:#183b63;margin-top:12px}.print-qr{text-align:center;background:#f5f9ff;border:1px solid #d9e7f7;border-radius:16px;padding:12px;height:max-content}.print-qr h3{font-size:15px;color:var(--blue);margin:0 0 7px}.print-qr small{display:block;font-size:10px;color:var(--muted);margin-top:6px}.print-footer{height:87px;background:var(--navy);color:#fff;padding:10px 28px;display:flex;justify-content:space-between;align-items:center;box-sizing:border-box}.print-footer img{width:150px;background:#fff;border-radius:6px}.print-footer span{font-size:13px;font-weight:800}
@media(max-width:650px){.bc-top{flex-direction:column;align-items:flex-start}.bc-logo{width:210px}.bc-profile{grid-template-columns:1fr}.bc-name{font-size:32px}.bc-body{padding:22px}.bc-footer{flex-direction:column;align-items:flex-start}.bc-footer-text{text-align:left}.bc-actions a,.bc-actions button{width:100%;text-align:center}}
</style>
</head>
<body>
<header class="header"><a class="brand" href="index.html"><div class="brand-mark">K</div><div><strong>कुर्डूवाडी</strong><small>DIGITAL BUSINESS CARD</small></div></a><a class="outline-btn" href="index.html">← मुख्यपृष्ठ</a></header>
<main class="bc-page"><p class="bc-note">डिजिटल बिझनेस कार्ड • प्रिंट साईज <strong>85 × 55 mm</strong> • QR Code सह</p><div id="card" class="bc-shell"><div class="bc-body"><p>कार्ड शोधत आहे...</p></div></div></main>
<div id="downloadArea" class="bc-card-download" aria-hidden="true"></div>
<script src="js/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script><script src="js/site.js"></script><script src="js/analytics.js"></script>
<script>
const cfg=window.KURDUWADI_CONFIG;const db=supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);const params=new URLSearchParams(location.search);const slug=params.get('slug');const autoDownload=params.get('download')==='1';const cardUrl=location.origin+location.pathname+'?slug='+encodeURIComponent(slug||'');
function esc(v){return String(v??'').replace(/[&<>'\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]))}
function safeUrl(v){try{const u=new URL(v);return ['http:','https:'].includes(u.protocol)?u.href:'#'}catch{return '#'}}
function tel(v){return String(v||'').replace(/[^\d+]/g,'')}
function wa(v){let n=String(v||'').replace(/\D/g,'').replace(/^0+/,'');return n.length===10?'91'+n:n}
async function buildDownloadCard(data){const area=document.getElementById('downloadArea');area.innerHTML=`<div id="printCard" class="print-card"><div class="print-head"><img src="assets/kurduwadi-logo.svg" alt="Kurduwadi City Portal"><span class="print-badge">DIGITAL BUSINESS CARD</span></div><div class="print-main"><div><h1>${esc(data.name)}</h1>${data.business_name?`<h2>${esc(data.business_name)}</h2>`:''}${data.designation?`<p><strong>${esc(data.designation)}</strong></p>`:''}${data.bio?`<p>${esc(data.bio)}</p>`:''}<div class="print-contact">${data.phone?`📞 ${esc(data.phone)}<br>`:''}${data.whatsapp?`🟢 WhatsApp: ${esc(data.whatsapp)}<br>`:''}${data.email?`✉ ${esc(data.email)}<br>`:''}${data.address?`📍 ${esc(data.address)}`:''}</div></div><div class="print-qr"><h3>Scan to Visit Card</h3><div id="downloadQr"></div><small>QR स्कॅन करून डिजिटल कार्ड उघडा.</small></div></div><div class="print-footer"><span>Powered by कुर्डूवाडी सिटी पोर्टल</span><img src="assets/kurduwadi-logo.svg" alt="Kurduwadi City Portal"></div></div>`;await new Promise(r=>setTimeout(r,70));new QRCode(document.getElementById('downloadQr'),{text:cardUrl,width:150,height:150,colorDark:'#111',colorLight:'#fff'});return document.getElementById('printCard')}
async function downloadCard(data){const card=await buildDownloadCard(data);const canvas=await html2canvas(card,{width:1011,height:654,scale:2,useCORS:true,backgroundColor:'#fff',logging:false});const a=document.createElement('a');a.download=(data.name||'business-card').replace(/[^\w\u0900-\u097F-]+/g,'-')+'-85x55mm-kurduwadi.png';a.href=canvas.toDataURL('image/png');document.body.appendChild(a);a.click();a.remove()}
async function shareCard(){const url=cardUrl;if(navigator.share){try{await navigator.share({title:'डिजिटल बिझनेस कार्ड | कुर्डूवाडी',text:'माझे डिजिटल बिझनेस कार्ड',url})}catch(e){}}else{try{await navigator.clipboard.writeText(url);alert('✅ कार्डची लिंक कॉपी झाली.')}catch{prompt('कार्डची लिंक कॉपी करा:',url)}}}
(async()=>{const el=document.getElementById('card');if(!slug){el.innerHTML='<div class="bc-body"><h2>कार्ड सापडले नाही</h2></div>';return}const {data,error}=await db.from('business_cards').select('*').eq('slug',slug).eq('status','approved').maybeSingle();if(error||!data){el.innerHTML='<div class="bc-body"><h2>कार्ड सापडले नाही</h2><p>कृपया Admin मंजुरीनंतर मिळालेली link वापरा.</p></div>';return}document.title=(data.name||'Digital Card')+' | कुर्डूवाडी';el.innerHTML=`<div class="bc-top"><img class="bc-logo" src="assets/kurduwadi-logo.svg" alt="Kurduwadi City Portal"><span class="bc-kicker">DIGITAL BUSINESS CARD</span></div><div class="bc-body"><div class="bc-profile"><div><h1 class="bc-name">${esc(data.name)}</h1>${data.business_name?`<div class="bc-business">${esc(data.business_name)}</div>`:''}${data.designation?`<div class="bc-designation">${esc(data.designation)}</div>`:''}${data.bio?`<p class="bc-bio">${esc(data.bio)}</p>`:''}<div class="bc-info">${data.phone?`<div class="bc-row"><b>📞 मोबाईल</b><a href="tel:${esc(tel(data.phone))}">${esc(data.phone)}</a></div>`:''}${data.whatsapp?`<div class="bc-row"><b>🟢 WhatsApp</b><a href="https://wa.me/${esc(wa(data.whatsapp))}" target="_blank" rel="noopener">${esc(data.whatsapp)}</a></div>`:''}${data.email?`<div class="bc-row"><b>✉ Email</b><a href="mailto:${esc(data.email)}">${esc(data.email)}</a></div>`:''}${data.address?`<div class="bc-row"><b>📍 पत्ता</b><span>${esc(data.address)}</span></div>`:''}${data.website?`<div class="bc-row"><b>🌐 Website</b><a href="${esc(safeUrl(data.website))}" target="_blank" rel="noopener">Website उघडा</a></div>`:''}</div></div><div class="bc-qrbox"><h3>Scan to Visit Card</h3><div id="qrcode" class="bc-qr"></div><small>हा QR स्कॅन करून<br><strong>हेच डिजिटल बिझनेस कार्ड</strong> उघडा.</small><div class="print-size">85 × 55 mm</div></div></div><div class="bc-actions"><button class="bc-download" id="downloadBtn">⬇️ कार्ड Download करा</button><button class="bc-share" id="shareBtn">↗️ Share Card</button><a class="bc-back" href="index.html">मुख्यपृष्ठ</a></div></div><div class="bc-footer"><img src="assets/kurduwadi-logo.svg" alt="Kurduwadi City Portal"><div class="bc-footer-text">आपले शहर • आपली माहिती • आपला डिजिटल प्लॅटफॉर्म<br><strong>Powered by कुर्डूवाडी सिटी पोर्टल</strong></div></div>`;new QRCode(document.getElementById('qrcode'),{text:cardUrl,width:190,height:190,colorDark:'#111',colorLight:'#fff'});document.getElementById('downloadBtn').onclick=()=>downloadCard(data);document.getElementById('shareBtn').onclick=shareCard;if(autoDownload)setTimeout(()=>downloadCard(data),700)})();
</script>
</body></html>
