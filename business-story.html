<!doctype html>
<html lang="mr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="कुर्डूवाडीतील व्यवसायाची कहाणी, इतिहास, प्रेरणा आणि कर्तृत्व.">
<title>व्यवसायाची कहाणी | आम्ही कुर्डूवाडीकर</title>
<link rel="canonical" href="https://aamhikurduwadikar.com/business-story.html">
<link rel="icon" href="assets/kurduwadi-logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/directory-premium.css">
<style>
.story-shell{max-width:1050px;margin:0 auto;padding:28px 18px 70px}.story-back{display:inline-block;margin-bottom:16px}.story-hero{background:linear-gradient(135deg,#102a43,#234e70);color:#fff;border-radius:24px;padding:28px;display:grid;grid-template-columns:180px 1fr;gap:24px;align-items:center;box-shadow:0 14px 36px rgba(16,42,67,.16)}.story-photo{width:180px;height:180px;border-radius:20px;object-fit:cover;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25)}.story-kicker{font-size:12px;letter-spacing:.12em;font-weight:800;opacity:.78}.story-hero h1{margin:6px 0;font-size:clamp(28px,5vw,46px)}.story-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.story-pill{padding:7px 11px;border-radius:999px;background:rgba(255,255,255,.12);font-size:14px}.story-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.story-actions a,.story-actions button{border:0;border-radius:12px;padding:11px 15px;font:inherit;font-weight:800;cursor:pointer;text-decoration:none}.story-primary{background:#fff;color:#102a43}.story-secondary{background:rgba(255,255,255,.12);color:#fff}.story-grid{display:grid;grid-template-columns:1.5fr .8fr;gap:18px;margin-top:20px}.story-card{background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:22px;box-shadow:0 8px 24px rgba(15,23,42,.05)}.story-card h2{margin-top:0}.story-section{padding:14px 0;border-bottom:1px solid #edf0f3}.story-section:last-child{border-bottom:0}.story-section h3{margin:0 0 7px;font-size:18px}.story-section p{margin:0;line-height:1.75;white-space:pre-line}.story-contact p{margin:9px 0}.story-contact a{font-weight:700}.story-empty{padding:70px 20px;text-align:center}.story-loading{padding:70px 20px;text-align:center}.story-muted{color:#667085}.story-credit{margin-top:18px;font-size:13px;color:#667085}@media(max-width:760px){.story-hero{grid-template-columns:1fr}.story-photo{width:130px;height:130px}.story-grid{grid-template-columns:1fr}}
</style>
</head>
<body class="directory-page">
<header class="header"><a class="brand" href="index.html"><img src="assets/kurduwadi-logo.svg" alt="कुर्डूवाडी" width="48" height="48"><div><strong>कुर्डूवाडी</strong><small>KURDUWADI COMMUNITY PORTAL</small></div></a><nav><a href="index.html">मुख्यपृष्ठ</a><a href="directory.html">डिरेक्टरी</a><a href="news.html">बातम्या</a><a href="gallery.html">गॅलरी</a></nav><a class="outline-btn" href="directory-submit.html">＋ व्यवसाय नोंदवा</a></header>
<main class="story-shell"><a class="story-back" href="directory.html">← व्यवसाय निर्देशिकेकडे परत</a><div id="storyRoot" class="story-loading">व्यवसायाची माहिती लोड होत आहे…</div></main>
<script src="js/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){'use strict';const cfg=window.KURDUWADI_CONFIG||{};const sb=window.supabase?.createClient?.(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);const root=document.getElementById('storyRoot');const id=new URLSearchParams(location.search).get('id');
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const safeUrl=v=>/^https?:\/\//i.test(String(v||''))?String(v):'';const phone=v=>String(v||'').replace(/\D/g,'').replace(/^0+/,'');
function section(title,value){if(!value)return '';return `<section class="story-section"><h3>${esc(title)}</h3><p>${esc(value)}</p></section>`}
function shareText(x){return `🏪 ${x.business_name}\n\n${x.origin_story||'कुर्डूवाडीतील एका व्यवसायाची प्रेरणादायी कहाणी.'}\n\nआम्ही कुर्डूवाडीकर — स्थानिक व्यवसाय आणि त्यांच्या कथा एका ठिकाणी.`}
async function load(){if(!id||!sb){root.innerHTML='<div class="story-empty"><h2>व्यवसाय सापडला नाही</h2><a href="directory.html">Directory वर जा</a></div>';return}const {data:x,error}=await sb.from('kurduwadi_directory').select('*').eq('id',id).eq('status','approved').eq('is_approved',true).maybeSingle();if(error||!x){root.innerHTML='<div class="story-empty"><h2>ही व्यवसाय माहिती उपलब्ध नाही.</h2><p class="story-muted">Admin पडताळणीनंतर प्रकाशित झालेली माहितीच येथे दिसते.</p><a href="directory.html">← Directory</a></div>';return}
const img=safeUrl(x.image_url);const p=phone(x.contact_number);const wa=p?`https://wa.me/${p}?text=${encodeURIComponent('नमस्कार, '+x.business_name+' संदर्भात संपर्क करायचा आहे.')}`:'';const shareUrl=location.href;
root.innerHTML=`<section class="story-hero"><div>${img?`<img class="story-photo" src="${esc(img)}" alt="${esc(x.business_name)}">`:`<div class="story-photo"></div>`}</div><div><div class="story-kicker">KURDUWADI BUSINESS STORY</div><h1>${esc(x.business_name)}</h1><div class="story-meta"><span class="story-pill">✓ पडताळलेला व्यवसाय</span>${x.category?`<span class="story-pill">${esc(x.category)}</span>`:''}${x.founded_year?`<span class="story-pill">स्थापना: ${esc(x.founded_year)}</span>`:''}${x.owner_name?`<span class="story-pill">संस्थापक: ${esc(x.owner_name)}</span>`:''}</div><div class="story-actions">${p?`<a class="story-primary" href="tel:${esc(p)}">📞 कॉल</a>`:''}${wa?`<a class="story-secondary" href="${esc(wa)}" target="_blank" rel="noopener">💬 WhatsApp</a>`:''}<button class="story-secondary" id="shareBtn">📤 Share</button></div></div></section><div class="story-grid"><article class="story-card"><h2>📖 या व्यवसायाची कहाणी</h2>${section('व्यवसायाची सुरुवात',x.origin_story)}${section('व्यवसायाचा इतिहास',x.business_history)}${section('प्रेरणा',x.inspiration)}${section('काय सेवा / उत्पादने मिळतात?',x.products_services)}${section('कुटुंबाचा सहभाग',x.family_story)}${section('विशेष कर्तृत्व / उपलब्धी',x.achievements)}${section('समाजासाठी योगदान',x.community_contribution)}${section('भविष्यातील स्वप्न',x.future_vision)}<div class="story-credit">ही माहिती व्यवसाय प्रतिनिधीने दिली असून प्रकाशनापूर्वी Admin पडताळणी केली जाते.</div></article><aside><div class="story-card story-contact"><h2>📍 संपर्क</h2>${x.owner_name?`<p>👤 ${esc(x.owner_name)}</p>`:''}${x.address?`<p>📍 ${esc(x.address)}</p>`:''}${x.timings?`<p>🕒 ${esc(x.timings)}</p>`:''}${p?`<p>📱 ${esc(x.contact_number)}</p>`:''}${x.email?`<p>✉️ ${esc(x.email)}</p>`:''}${safeUrl(x.google_maps_link)?`<p><a href="${esc(x.google_maps_link)}" target="_blank" rel="noopener">🗺️ Google Maps</a></p>`:''}${safeUrl(x.website)?`<p><a href="${esc(x.website)}" target="_blank" rel="noopener">🌐 Website</a></p>`:''}${safeUrl(x.instagram)?`<p><a href="${esc(x.instagram)}" target="_blank" rel="noopener">📸 Instagram</a></p>`:''}${safeUrl(x.facebook)?`<p><a href="${esc(x.facebook)}" target="_blank" rel="noopener">📘 Facebook</a></p>`:''}${safeUrl(x.video_url)?`<p><a href="${esc(x.video_url)}" target="_blank" rel="noopener">🎥 Business Video</a></p>`:''}</div></aside></div>`;
document.getElementById('shareBtn')?.addEventListener('click',async()=>{try{if(navigator.share){await navigator.share({title:x.business_name,text:shareText(x),url:shareUrl})}else{await navigator.clipboard.writeText(shareUrl);alert('✅ लिंक कॉपी झाली. WhatsApp/Facebook वर share करा.')}}catch(e){}});document.title=x.business_name+' | व्यवसायाची कहाणी | आम्ही कुर्डूवाडीकर';}
load();})();
</script>
</body></html>
