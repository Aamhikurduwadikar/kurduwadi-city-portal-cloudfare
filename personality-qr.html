<!doctype html><html lang="mr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>व्यक्तिमत्त्व QR | कुर्डूवाडी</title><link rel="stylesheet" href="css/style.css"><style>.qr-page{max-width:760px;margin:auto;padding:28px 16px 60px}.qr-card{background:#fff;border:1px solid #e5e8eb;border-radius:24px;padding:28px;text-align:center;box-shadow:0 18px 50px rgba(20,40,55,.1)}.qr-card h1{margin:8px 0;color:#17344a}.qr-card p{color:#61727c;line-height:1.7}.identity{margin:18px auto;padding:16px;border-radius:16px;background:#f6f9fc;border:1px solid #e1e8ef}.identity b{font-size:22px;color:#17344a}.identity small{display:block;margin-top:5px;color:#718096}.qr-box{display:inline-flex;background:#fff;padding:14px;border:1px solid #e1e6e8;border-radius:18px;margin:18px auto}.qr-box img{width:min(300px,72vw);height:auto;display:block}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:16px}.btn{border:0;border-radius:12px;padding:12px 16px;background:#17344a;color:#fff;font-weight:800;text-decoration:none;cursor:pointer}.btn.secondary{background:#eef2f4;color:#17344a}.error{padding:30px;color:#8b3a2b}</style></head><body class="form-page"><header class="header"><a class="brand" href="personalities.html"><div class="brand-mark">K</div><div><strong>आम्ही Kurduwadikar</strong><small>KURDUWADI COMMUNITY PORTAL</small></div></a><a class="outline-btn" href="personalities.html">← व्यक्तिमत्त्वे</a></header><main class="qr-page"><div class="qr-card"><div class="section-label">KURDUWADI PRIDE</div><div id="content"><p>QR माहिती लोड होत आहे...</p></div></div></main><script src="js/config.js?v=20260916-qr"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const cfg=window.KURDUWADI_CONFIG||{},db=window.supabase?.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY),id=new URLSearchParams(location.search).get('id'),content=document.getElementById('content');(async()=>{if(!db||!id){content.innerHTML='<div class="error">व्यक्तिमत्त्वाची माहिती सापडली नाही.</div>';return}const {data:p,error}=await db.from('personalities').select('id,name,field,position,status').eq('id',id).eq('status','approved').maybeSingle();if(error||!p){content.innerHTML='<div class="error">ही QR माहिती उपलब्ध नाही.</div>';return}const profile=new URL('personality-view.html?id='+encodeURIComponent(p.id),location.href).href;const qr='https://api.qrserver.com/v1/create-qr-code/?size=500x500&margin=16&data='+encodeURIComponent(profile);document.title=p.name+' | QR | कुर्डूवाडी';content.innerHTML=`<h1>📱 व्यक्तिमत्त्व QR</h1><div class="identity"><b>${esc(p.name)}</b><small>${esc(p.field||p.position||'कुर्डूवाडीचे अभिमानास्पद व्यक्तिमत्त्व')}</small></div><p>हा QR Code <b>${esc(p.name)}</b> यांच्या अधिकृत Portal Profile साठी आहे.</p><div class="qr-box"><img id="qr" src="${qr}" alt="${esc(p.name)} यांचा QR Code"></div><div class="actions"><a class="btn" href="${profile}">Profile उघडा →</a><button class="btn secondary" id="download">⬇️ QR Download</button><button class="btn secondary" id="share">📤 Share</button></div>`;document.getElementById('download').onclick=()=>{const a=document.createElement('a');a.href=qr;a.download='kurduwadi-'+p.id+'-qr.png';a.target='_blank';a.click()};document.getElementById('share').onclick=async()=>{try{if(navigator.share)await navigator.share({title:p.name+' | कुर्डूवाडी',text:p.name+' यांची कुर्डूवाडी Portal Profile',url:profile});else{await navigator.clipboard.writeText(profile);alert('Profile link copy झाला.')}}catch(e){}}})();</script></body></html>
