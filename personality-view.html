<!doctype html><html lang="mr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="कुर्डूवाडीची अभिमानास्पद व्यक्तिमत्त्व माहिती"><title>अभिमानास्पद व्यक्तिमत्त्व | आम्ही Kurduwadikar</title><link rel="stylesheet" href="css/style.css"><style>.pv{max-width:900px;margin:auto;padding:28px 5% 60px}.pv-card{background:#fff;border:1px solid #eadfd4;border-radius:24px;padding:24px;box-shadow:0 12px 35px rgba(60,40,25,.08)}.pv-photo{width:100%;max-height:480px;object-fit:cover;border-radius:18px;background:#eef5fa}.pv h1{font-size:clamp(30px,5vw,52px);margin:18px 0 8px;color:#4b3526}.pv-meta{color:#8a7668;margin-bottom:18px}.pv-text{color:#51453d;line-height:1.8}.pv-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.pv-actions a,.pv-actions button{border:1px solid #dcb58f;border-radius:12px;padding:11px 15px;background:#fff7ee;color:#91460f;text-decoration:none;font-weight:800;cursor:pointer}.pv-actions .primary{background:#9a4b13;color:#fff;border-color:#9a4b13}.qr-box{margin-top:24px;padding:14px;text-align:center;background:#fffaf5;border:1px solid #eadfd4;border-radius:18px}.qr-box img{width:min(150px,42vw);height:auto;display:block;margin:8px auto}.qr-box b{font-size:13px}.qr-box .pv-meta{font-size:10px;margin:5px 0 0}.loading{text-align:center;padding:50px}</style></head><body class="form-page"><header class="header"><a class="brand" href="personalities.html"><div class="brand-mark">K</div><div><strong>आम्ही Kurduwadikar</strong><small>KURDUWADI COMMUNITY PORTAL</small></div></a><a class="outline-btn" href="personalities.html">← अभिमान व्यक्तिमत्त्वे</a></header><main class="pv"><div id="status" class="loading">माहिती लोड होत आहे...</div><article id="card" class="pv-card" hidden></article></main><script src="js/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const {SUPABASE_URL,SUPABASE_ANON_KEY}=window.KURDUWADI_CONFIG||{};const db=window.supabase?.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);const id=new URLSearchParams(location.search).get('id');const status=document.getElementById('status'),card=document.getElementById('card');
(async()=>{if(!db||!id){status.textContent='व्यक्तिमत्त्वाची माहिती सापडली नाही.';return;}const {data:p,error}=await db.from('personalities').select('*').eq('id',id).eq('status','approved').maybeSingle();if(error||!p){status.textContent='ही माहिती उपलब्ध नाही किंवा अजून मंजूर झालेली नाही.';return;}const url=location.href.split('#')[0],qr='https://api.qrserver.com/v1/create-qr-code/?size=500x500&margin=16&data='+encodeURIComponent(url);document.title=p.name+' | कुर्डूवाडी अभिमान';card.innerHTML=`<div class="section-label">KURDUWADI PRIDE</div>${p.photo_url?`<img class="pv-photo" src="${esc(p.photo_url)}" alt="${esc(p.name)}">`:'<div style="height:260px;border-radius:18px;background:#eef5fa;display:grid;place-items:center;font-size:80px">🏅</div>'}<h1>${esc(p.name)}</h1><div class="pv-meta">${esc(p.field||'अभिमानास्पद व्यक्तिमत्त्व')}${p.position?' • '+esc(p.position):''}</div>${p.major_work?`<p class="pv-text"><b>मुख्य कार्य:</b><br>${esc(p.major_work)}</p>`:''}${p.achievements?`<p class="pv-text"><b>कामगिरी:</b><br>${esc(p.achievements)}</p>`:''}${p.social_contribution?`<p class="pv-text"><b>सामाजिक योगदान:</b><br>${esc(p.social_contribution)}</p>`:''}${p.reason?`<p class="pv-text"><b>माहिती:</b><br>${esc(p.reason)}</p>`:''}<div class="pv-actions"><button class="primary" onclick="navigator.share?navigator.share({title:document.title,url:location.href}):navigator.clipboard.writeText(location.href).then(()=>alert('Link कॉपी झाला.'))">📤 Share</button><a href="${qr}" target="_blank" rel="noopener">📱 QR उघडा</a><a href="${qr}" download="kurduwadi-personality-qr.png">⬇️ QR Download</a><button onclick="window.print()">🖨️ Print</button></div><div class="qr-box"><b>या व्यक्तिमत्त्वाची माहिती Share करण्यासाठी QR</b><br><img src="${qr}" alt="${esc(p.name)} QR"><p class="pv-meta">QR Scan केल्यावर हेच Profile उघडेल.</p></div>`;status.hidden=true;card.hidden=false;})();</script></body></html>
