<!doctype html><html lang="mr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="कुर्डुवाडी नागरिकाचे मंजूर सार्वजनिक प्रोफाइल."><title>नागरिक प्रोफाइल | कुर्डुवाडी</title><link rel="icon" href="assets/kurduwadi-logo.svg" type="image/svg+xml"><link rel="stylesheet" href="css/style.css"><style>.public-profile{max-width:900px;margin:0 auto;padding:30px 18px 90px}.pp-card{background:#fff;border:1px solid #e3e8ee;border-radius:24px;padding:26px;box-shadow:0 14px 40px rgba(20,40,60,.08)}.pp-head{display:flex;gap:20px;align-items:center}.pp-photo,.pp-avatar{width:110px;height:110px;border-radius:50%;flex:0 0 110px}.pp-photo{object-fit:cover}.pp-avatar{display:grid;place-items:center;background:#f3e8d0;color:#7a4b16;font-size:42px;font-weight:900}.pp-head h1{margin:0;color:#18324d;font-size:34px}.pp-city{margin-top:5px;color:#64748b}.verified{display:inline-block;margin-top:9px;padding:6px 10px;border-radius:99px;background:#eaf7ef;color:#087f5b;font-weight:800;font-size:12px}.pp-info{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:25px}.pp-item{padding:14px;border:1px solid #e8edf2;border-radius:14px;background:#fafcff}.pp-item small{display:block;color:#718096;margin-bottom:4px}.pp-item b{color:#263f53}.pp-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.pp-actions a{padding:11px 15px;border-radius:11px;text-decoration:none;font-weight:800;border:1px solid #d7e0e8;color:#18324d}.pp-actions .primary{background:#9a4b13;color:#fff;border-color:#9a4b13}.pp-note{margin-top:20px;color:#718096;font-size:12px;line-height:1.6}@media(max-width:600px){.public-profile{padding:20px 14px 80px}.pp-card{padding:20px}.pp-head{align-items:flex-start}.pp-photo,.pp-avatar{width:82px;height:82px;flex-basis:82px}.pp-head h1{font-size:27px}.pp-info{grid-template-columns:1fr}}
</style></head><body><header class="header"><a class="brand" href="index.html"><img src="assets/kurduwadi-logo.svg" alt="कुर्डुवाडी" width="48" height="48"><div><strong>कुर्डुवाडी</strong><small>KURDUWADI CITY PORTAL</small></div></a><a class="outline-btn" href="index.html">← मुख्यपृष्ठ</a></header><main class="public-profile"><div class="directory-crumbs"><a href="index.html">मुख्यपृष्ठ</a> › <a href="directory.html">डिरेक्टरी</a> › नागरिक प्रोफाइल</div><section id="profileBox" class="pp-card" aria-live="polite">मंजूर प्रोफाइल लोड होत आहे…</section></main><script src="js/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(async()=>{const box=document.getElementById('profileBox'),C=window.KURDUWADI_CONFIG||{},id=new URLSearchParams(location.search).get('id');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));if(!id||!C.SUPABASE_URL||!C.SUPABASE_ANON_KEY){box.innerHTML='<h2>प्रोफाइल उपलब्ध नाही</h2><p>कृपया मुख्यपृष्ठावरून प्रोफाइल निवडा.</p>';return}try{const db=supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY),r=await db.from('profiles').select('id,name,education,job,city,state,country,blood_group,blood_public,skills,phone,work_fields,photo_url').eq('id',id).eq('status','approved').eq('is_public',true).maybeSingle();if(r.error||!r.data){box.innerHTML='<h2>प्रोफाइल सापडले नाही</h2><p>ही प्रोफाइल उपलब्ध किंवा public नाही.</p>';return}const p=r.data,n=esc(p.name||'कुर्डुवाडी नागरिक'),initial=esc((p.name||'कु').trim().charAt(0)),fields=Array.isArray(p.work_fields)?p.work_fields.filter(Boolean).join(' • '):(p.work_fields||'');box.innerHTML=`<div class="pp-head">${p.photo_url?`<img class="pp-photo" src="${esc(p.photo_url)}" alt="${n}">`:`<div class="pp-avatar">${initial}</div>`}<div><h1>${n}</h1><div class="pp-city">📍 ${esc(p.city||'कुर्डुवाडी')}${p.state?`, ${esc(p.state)}`:''}</div><span class="verified">✓ Admin Verified • Public Profile</span></div></div><div class="pp-info">${p.job?`<div class="pp-item"><small>💼 नोकरी / व्यवसाय</small><b>${esc(p.job)}</b></div>`:''}${p.education?`<div class="pp-item"><small>🎓 शिक्षण</small><b>${esc(p.education)}</b></div>`:''}${fields?`<div class="pp-item"><small>🎯 कार्यक्षेत्र</small><b>${esc(fields)}</b></div>`:''}${p.skills?`<div class="pp-item"><small>🛠️ कौशल्ये</small><b>${esc(p.skills)}</b></div>`:''}${p.blood_public&&p.blood_group?`<div class="pp-item"><small>🩸 Blood Group</small><b>${esc(p.blood_group)}</b></div>`:''}</div><div class="pp-actions">${p.phone?`<a class="primary" href="tel:${esc(p.phone)}">📞 संपर्क</a>`:''}<a href="directory.html">← सर्व प्रोफाइल</a><a href="index.html">मुख्यपृष्ठ</a></div><div class="pp-note">ही माहिती Admin पडताळणीनंतर public करण्यास परवानगी दिलेल्या profile मधून दाखवली आहे. ज्या माहितीला public परवानगी नाही ती येथे दाखवली जात नाही.</div>`}catch(e){console.error(e);box.innerHTML='<h2>प्रोफाइल लोड करता आली नाही</h2><p>कृपया पुन्हा प्रयत्न करा.</p>'}})();</script><script src="js/site.js"></script><script src="js/analytics.js"></script></body></html>
