<!doctype html><html lang="mr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>सूचना फलकावर नोंद करा | आम्ही Kurduwadikar</title><link rel="stylesheet" href="css/style.css"></head><body class="form-page"><header class="header"><a class="brand" href="index.html"><div class="brand-mark">K</div><div><strong>आम्ही Kurduwadikar</strong><small>KURDUWADI COMMUNITY PORTAL</small></div></a><a class="outline-btn" href="noticeboard.html">← सूचना फलक</a></header><main class="form-wrap"><div class="form-intro"><span class="section-label">NOTICE SUBMISSION</span><h1>📌 सूचना फलकावर नोंद करा</h1><p>जन्म, विवाह, यश, श्रद्धांजली, हरवले/सापडले किंवा इतर महत्त्वाची माहिती पाठवा. Admin तपासणीनंतरच ती सार्वजनिक केली जाईल.</p></div><form id="noticeForm"><label>प्रकार *<select name="type" required><option value="birth">👶 जन्म</option><option value="marriage">💍 विवाह</option><option value="achievement">🏅 यश</option><option value="obituary">🕯️ श्रद्धांजली</option><option value="lost_found">🔍 हरवले/सापडले</option><option value="other">📌 इतर</option></select></label><label>शीर्षक *<input name="title" required maxlength="160" placeholder="उदा. अमुक व्यक्तीचे स्पर्धेत यश"></label><label>माहिती *<textarea name="description" rows="8" required maxlength="8000" placeholder="सविस्तर माहिती..."></textarea></label><div class="two"><label>नाव<input name="person_name" maxlength="120" placeholder="संबंधित व्यक्तीचे नाव"></label><label>तारीख<input name="notice_date" type="date"></label></div><div class="two"><label>मोबाईल (ऐच्छिक)<input name="contact" maxlength="30" inputmode="tel"></label><label>फोटो (ऐच्छिक)<input name="image" type="file" accept="image/jpeg,image/png,image/webp"></label></div><p class="upload-note">फोटो कमाल 5 MB. JPG, PNG किंवा WebP.</p><button class="primary-btn" type="submit">नोंद पाठवा →</button><p id="noticeMsg" class="form-message"></p></form></main><script src="js/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/notice-submit.js"></script><script src="js/site.js"></script><script src="js/analytics.js"></script>
</body></html>
